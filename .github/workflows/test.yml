name: Plugin tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun --no-env-file test
      - run: bash tests/clipboard-helper.test.sh
      - run: python3 tests/public-fetch.test.py

  native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Manifest, strict QML lint and native release regressions
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/plugin:ro"
          archlinux:base@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
          bash -lc 'pacman -Syu --noconfirm qt6-declarative qt6-wayland qt6-svg gcc pkgconf ttf-dejavu quickshell python git jq curl weston && bash /plugin/scripts/ci-native.sh'
